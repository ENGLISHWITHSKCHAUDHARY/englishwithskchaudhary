<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 English Semester Paper Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }

        .question p { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .options label { display: block; margin: 6px 0; cursor: pointer; padding: 8px; border-radius: 5px; background: #f9f9f9; border: 1px solid #eee; }
        .options label:hover { background: #eef5fc; }
        button { display: block; width: 100%; padding: 12px; background: #27ae60; color: white; border: none; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #219150; }
        #result { font-size: 20px; font-weight: bold; text-align: center; margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 5px; display: none; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
    </style>
</head>

</div>

function loadQuiz() {
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";
    quizData.forEach((item, index) => {
        let qHtml = `<div class="question" id="q${index}">
            <p>${item.q}</p>
            <div class="options">`;
        item.options.forEach((opt, optIndex) => {
            qHtml += `<label id="label_${index}_${optIndex}">
                <input type="radio" name="question_${index}" value="${optIndex}"> ${opt}
            </label>`;
        });
        qHtml += `</div></div>`;
        container.innerHTML += qHtml;
    });
}

function submitQuiz() {
    let score = 0;
    quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="question_${index}"]:checked`);
        const correctLabel = document.getElementById(`label_${index}_${item.ans}`);
        
        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === item.ans) {
                score++;
                correctLabel.classList.add("correct");
            } else {
                document.getElementById(`label_${index}_${userAns}`).classList.add("wrong");
                correctLabel.classList.add("correct");
            }
        } else {
            correctLabel.classList.add("correct");
        }
    });

    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `You scored ${score} out of ${quizData.length} (${((score/quizData.length)*100).toFixed(2)}%)`;
    document.getElementById("restartBtn").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
    document.getElementById("quizForm").reset();
    document.getElementById("result").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";
    loadQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadQuiz();
</script>
